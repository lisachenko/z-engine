name: Publish PHP debug images

# Builds and pushes the --enable-debug PHP images used by the
# tests-internal-debug CI job. Run this once manually to bootstrap CI, then it
# refreshes monthly to pick up new patch releases.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.4'
            ts: nts
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/docker/php-debug.Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php }}
          tags: ghcr.io/${{ github.repository_owner }}/z-engine-php:${{ matrix.php }}-${{ matrix.ts }}-debug
          push: true
