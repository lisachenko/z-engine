name: CI

on:
  push:
    branches:
      - master
      - '[0-9].[0-9]'
  pull_request:

# Build and test only: no job here writes to the repository or its API.
permissions:
  contents: read

# One CI run per ref. Superseded pull-request runs are cancelled (the next push
# re-runs everything anyway); branch runs are left alone so the history of a
# pushed version branch keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This branch targets PHP 8.6 only - engine structures are version-specific.
env:
  PHP_MINOR: '8.6'

jobs:
  tests:
    name: Tests (release, ${{ matrix.ts_label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ts: nts
            ts_label: NTS
            opcache_gate: composer test:opcache
          - ts: zts
            ts_label: ZTS
            # Since issue #118 the file-cache relocator supports ZTS payloads,
            # so this gate covers the full opcache group (the script is the
            # named alias the ZTS legs call; it no longer excludes anything)
            opcache_gate: composer test:opcache-zts
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        # opcache must be LOADED in the parent process: every opcache-gated test
        # skips itself on `extension_loaded('Zend OPcache')` and would otherwise
        # silently drop out of the run (issue #124). It stays INACTIVE here
        # (opcache.enable_cli=0) - the tests activate it explicitly in the child
        # processes that exercise shared memory, while the test runner itself
        # mutates the very classes opcache would publish as immutable. The JIT is
        # off everywhere: it rewrites the executor internals z-engine hooks into
        # (AGENTS.md).
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi, opcache
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=0, opcache.jit=off, opcache.jit_buffer_size=0
          coverage: none

      - name: Assert the thread-safety mode matches the matrix leg
        run: |
          php -r 'exit(ZEND_THREAD_SAFE === ("'"${{ matrix.ts }}"'" === "zts") ? 0 : 1);' \
            || { echo "::error::PHP thread-safety mode does not match the ${{ matrix.ts }} matrix leg"; exit 1; }

      - name: Assert the opcache extension is available to the test runner
        run: |
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' \
            || { echo "::error::Zend OPcache is not loaded - the opcache tests would silently skip"; exit 1; }

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run test suite
        run: composer test

      # The gate for issue #124: the opcache/shared-memory tests must have RUN.
      # They are self-skipping (no opcache extension, opcache not activatable in
      # the child process, fixture not published from shared memory), so without
      # this step a broken opcache setup reads as a green run.
      - name: Opcache/SHM coverage must not silently skip
        run: ${{ matrix.opcache_gate }}

      - name: Worker-loop soak (flat memory after warm-up)
        run: php -d ffi.enable=1 -d zend.assertions=1 -d opcache.jit=off tools/examples/worker-loop.php

  tests-opcache-runner:
    name: Tests (opcache active in runner, NTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        # Unlike the release legs above, opcache is ACTIVE in the runner process
        # itself (opcache.enable_cli=1): this is the consumer-facing environment
        # where every test file is compiled into shared memory and the library
        # must either work or fail loudly (SharedMemoryException and friends).
        # Tests that cannot hold under an opcache-active runner carry the
        # `opcache-incompatible` group, each with a TODO naming the tracking
        # issue that returns it to this job. Linux only by design: Windows
        # opcache support is an intentional non-goal (issue #119), and the
        # macOS legs stay artifact-gated.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi, opcache
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=1, opcache.jit=off, opcache.jit_buffer_size=0
          coverage: none

      - name: Assert opcache is active in the test runner
        run: |
          php -r 'exit((extension_loaded("Zend OPcache") && ini_get("opcache.enable_cli")) ? 0 : 1);' \
            || { echo "::error::Zend OPcache is not active in the runner - this job would test nothing"; exit 1; }

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Run test suite under an opcache-active runner
        run: composer test:opcache-runner

      # The child-process opcache/SHM coverage must hold in this environment too
      - name: Opcache/SHM coverage must not silently skip
        run: composer test:opcache

  tests-macos:
    name: Tests (macOS ${{ matrix.runner-arch.arch }}, ${{ matrix.ts }})
    runs-on: ${{ matrix.runner-arch.runner }}
    # setup-php installs PHP through Homebrew on macOS, and by default brew runs
    # a full `brew update` before every install and a cleanup after it - tens of
    # seconds of unrelated formula churn on top of the PHP install this job
    # needs. Both are pure overhead here (the runner image already ships a recent
    # brew and nothing else is installed), so switch them off for the whole job.
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    strategy:
      fail-fast: false
      matrix:
        runner-arch:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
        ts: [nts, zts]
    steps:
      - uses: actions/checkout@v7

      # The darwin artifacts can only be generated on macOS runners (see the
      # "Generate darwin headers" workflow). Until they are committed this leg
      # warns and skips instead of failing, so the matrix keeps macOS visible
      # without blocking unrelated work; once the artifacts land, every step
      # below runs for real.
      - name: Check the generated definitions are committed
        id: artifacts
        run: |
          if [ -f "include/${PHP_MINOR}/darwin-${{ matrix.runner-arch.arch }}-${{ matrix.ts }}/engine.h" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::include/${PHP_MINOR}/darwin-${{ matrix.runner-arch.arch }}-${{ matrix.ts }} is not committed yet - run the 'Generate darwin headers' workflow (issue #58)"
          fi

      # Same setup as the Linux tests job: opcache loaded but inactive in the
      # runner process, JIT off everywhere (see the comment there).
      - name: Set up PHP
        if: steps.artifacts.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi, opcache
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=0, opcache.jit=off, opcache.jit_buffer_size=0
          coverage: none

      - name: Assert the thread-safety mode matches the matrix leg
        if: steps.artifacts.outputs.present == 'true'
        run: |
          php -r 'exit(ZEND_THREAD_SAFE === ("'"${{ matrix.ts }}"'" === "zts") ? 0 : 1);' \
            || { echo "::error::PHP thread-safety mode does not match the ${{ matrix.ts }} matrix leg"; exit 1; }

      - name: Assert the opcache extension is available to the test runner
        if: steps.artifacts.outputs.present == 'true'
        run: |
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' \
            || { echo "::error::Zend OPcache is not loaded - the opcache tests would silently skip"; exit 1; }

      # engine.h declares no FFI_LIB: symbols must resolve from the running
      # php process image, which is the one genuinely platform-specific part
      # of the runtime. Prove it up front with a clear diagnostic.
      - name: FFI symbol-resolution preflight
        if: steps.artifacts.outputs.present == 'true'
        run: |
          php -d ffi.enable=1 -r '$e = FFI::cdef("const char *get_zend_version(void);"); echo $e->get_zend_version(), PHP_EOL;' \
            || { echo "::error::FFI cannot resolve engine symbols from the php process image on this build"; exit 1; }

      - name: Install dependencies
        if: steps.artifacts.outputs.present == 'true'
        uses: ramsey/composer-install@v4

      - name: Run test suite
        if: steps.artifacts.outputs.present == 'true'
        run: composer test

      # Same gates as the Linux legs (issue #124): the opcache/SHM tests must
      # have RUN. Since issue #118 the relocator group runs on ZTS too, so
      # both legs cover the full opcache group.
      - name: Opcache/SHM coverage must not silently skip
        if: steps.artifacts.outputs.present == 'true'
        run: ${{ matrix.ts == 'zts' && 'composer test:opcache-zts' || 'composer test:opcache' }}

      - name: Worker-loop soak (flat memory after warm-up)
        if: steps.artifacts.outputs.present == 'true'
        run: php -d ffi.enable=1 -d zend.assertions=1 -d opcache.jit=off tools/examples/worker-loop.php

  tests-windows:
    name: Tests (Windows x64, ${{ matrix.ts }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ts: nts, dll: php8.dll }
          - { ts: zts, dll: php8ts.dll }
    defaults:
      run:
        # Git Bash: keeps these step bodies identical to the other test jobs'.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The windows artifacts can only be generated on Windows runners (see
      # the "Generate windows headers" workflow). Until they are committed
      # this leg warns and skips instead of failing, so the matrix keeps
      # Windows visible without blocking unrelated work; once the artifacts
      # land, every step below runs for real.
      - name: Check the generated definitions are committed
        id: artifacts
        run: |
          if [ -f "include/${PHP_MINOR}/windows-x64-${{ matrix.ts }}/engine.h" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::include/${PHP_MINOR}/windows-x64-${{ matrix.ts }} is not committed yet - run the 'Generate windows headers' workflow (issue #59)"
          fi

      # Same setup as the Linux tests job: opcache loaded but inactive in the
      # runner process, JIT off everywhere (see the comment there).
      - name: Set up PHP
        if: steps.artifacts.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi, opcache
          ini-values: ffi.enable=1, zend.assertions=1, opcache.enable=1, opcache.enable_cli=0, opcache.jit=off, opcache.jit_buffer_size=0
          coverage: none

      - name: Assert the thread-safety mode matches the matrix leg
        if: steps.artifacts.outputs.present == 'true'
        run: |
          php -r 'exit(ZEND_THREAD_SAFE === ("'"${{ matrix.ts }}"'" === "zts") ? 0 : 1);' \
            || { echo "::error::PHP thread-safety mode does not match the ${{ matrix.ts }} matrix leg"; exit 1; }

      - name: Assert the opcache extension is available to the test runner
        if: steps.artifacts.outputs.present == 'true'
        run: |
          php -r 'exit(extension_loaded("Zend OPcache") ? 0 : 1);' \
            || { echo "::error::Zend OPcache is not loaded - the opcache tests would silently skip"; exit 1; }

      # Unlike Linux/macOS there is no process-image symbol resolution on
      # Windows: FFI binds the engine DLL explicitly (Core passes it to
      # FFI::cdef; the generated engine.h names it as FFI_LIB for the preload
      # path). Prove the DLL binds and that this FFI build supports
      # __vectorcall (ZEND_FASTCALL) with its @@N export mangling.
      - name: FFI symbol-resolution preflight
        if: steps.artifacts.outputs.present == 'true'
        run: |
          php -d ffi.enable=1 -r '$e = FFI::cdef("const char *get_zend_version(void);", "${{ matrix.dll }}"); echo $e->get_zend_version(), PHP_EOL;' \
            || { echo "::error::FFI cannot resolve engine symbols from ${{ matrix.dll }} on this build"; exit 1; }
          php -d ffi.enable=1 -r 'FFI::cdef("extern unsigned long long __vectorcall zend_string_hash_func(void *str);", "${{ matrix.dll }}");' \
            || { echo "::error::FFI cannot bind a __vectorcall symbol from ${{ matrix.dll }} - this build lacks vectorcall support"; exit 1; }

      - name: Install dependencies
        if: steps.artifacts.outputs.present == 'true'
        uses: ramsey/composer-install@v4

      - name: Run test suite
        if: steps.artifacts.outputs.present == 'true'
        run: composer test

      # No opcache/SHM non-skip gate here (unlike Linux/macOS): the file-cache
      # relocator does not support Windows payloads and opcache.preload does
      # not exist on Windows, so those tests self-skip by design. The gate
      # lands together with the relocator port (issue #119).

      - name: Worker-loop soak (flat memory after warm-up)
        if: steps.artifacts.outputs.present == 'true'
        run: php -d ffi.enable=1 -d zend.assertions=1 -d opcache.jit=off tools/examples/worker-loop.php

  static-analysis:
    name: PHPStan (level max)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none

      # composer.lock is deliberately not committed (a library pins nothing),
      # so the lock consistency check has to be skipped here.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - uses: ramsey/composer-install@v4

      # Runs after the install step: audit reads the lock file composer install
      # just resolved (there is no committed one to audit before that).
      - name: Audit dependencies for known advisories
        run: composer audit

      # PHPStan's result cache lives in the tmpDir configured in
      # phpstan.dist.neon. The key carries the run sha so every run stores a
      # fresh entry (cache entries are immutable), while restore-keys fall back
      # to the newest cache built from the same config + dependency set.
      - name: Cache the PHPStan result cache
        uses: actions/cache@v6
        with:
          path: var/phpstan
          key: phpstan-${{ env.PHP_MINOR }}-${{ hashFiles('phpstan.dist.neon', 'phpstan-baseline.neon', 'composer.json') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ env.PHP_MINOR }}-${{ hashFiles('phpstan.dist.neon', 'phpstan-baseline.neon', 'composer.json') }}-
            phpstan-${{ env.PHP_MINOR }}-

      - run: composer phpstan

  coding-standards:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi
          coverage: none
      - uses: ramsey/composer-install@v4

      # php-cs-fixer keeps per-file hashes in .php-cs-fixer.cache (gitignored)
      # and re-checks only what changed; it invalidates the cache itself when
      # the tool version or the rule set changes.
      - name: Cache the php-cs-fixer cache
        uses: actions/cache@v6
        with:
          path: .php-cs-fixer.cache
          key: php-cs-fixer-${{ env.PHP_MINOR }}-${{ hashFiles('.php-cs-fixer.dist.php', 'composer.json') }}-${{ github.sha }}
          restore-keys: |
            php-cs-fixer-${{ env.PHP_MINOR }}-${{ hashFiles('.php-cs-fixer.dist.php', 'composer.json') }}-
            php-cs-fixer-${{ env.PHP_MINOR }}-

      - run: composer cs:check

  tests-internal-debug:
    name: Internal group (debug build, ${{ matrix.ts_label }})
    runs-on: ubuntu-latest
    # The segfault-prone destructive tests run only against a --enable-debug
    # PHP build, where corruption surfaces as assertion failures. There is no
    # official debug PHP image, so we build one here from the official image's
    # own source (a full PHP compile) and run the tests in it. The build goes
    # through buildx so its layers can be cached across runs with actions/cache
    # - a warm cache turns the multi-minute compile into a layer restore.
    #
    # The cache key names every input that can change the image: OS,
    # architecture, thread safety, PHP minor, the recipe, and the digest of the
    # base image. See "Resolve the base image digest" below for why the last one
    # is not optional.
    strategy:
      fail-fast: false
      matrix:
        include:
          - ts: nts
            ts_label: NTS
            opcache_args: --group opcache --fail-on-skipped
          - ts: zts
            ts_label: ZTS
            # Since issue #118 the relocator tests run on ZTS too - both legs
            # gate the full opcache group against silent skips
            opcache_args: --group opcache --fail-on-skipped
    steps:
      - uses: actions/checkout@v7

      # Composer runs on a release PHP on the host; the debug container only
      # needs to run the already-installed PHPUnit (vendor/ is plain PHP).
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # `php:<minor>-cli` is a moving tag: every PHP patch release and every
      # Debian security rebuild gives it a new digest, and buildx then rightly
      # invalidates the compile layer built on top of it. A key that cannot
      # notice that is a cache that can never be repaired - actions/cache reports
      # a hit, refuses to overwrite the entry it already holds ("Cache hit
      # occurred on the primary key ..., not saving cache"), and the freshly
      # rebuilt layers are discarded at the end of every run. From then on every
      # run recompiles PHP from source, forever, until somebody edits the
      # Dockerfile. Putting the digest in the key makes the entry expire exactly
      # when a rebuild would produce something different - and only then.
      # imagetools reads the manifest from the registry, so this costs one API
      # call rather than the layers a hit exists to avoid pulling.
      - name: Resolve the base image digest
        id: image-cache-key
        run: |
          # Prints the raw manifest only on success, so a failed attempt cannot
          # feed half a response into the hash and make the key drift.
          resolve() {
            local raw
            for attempt in 1 2 3; do
              if raw="$(docker buildx imagetools inspect "$1" --raw)" && [ -n "$raw" ]; then
                printf '%s' "$raw"
                return 0
              fi
              sleep "$((attempt * 3))"
            done
            return 1
          }
          # While the minor is pre-release Docker publishes only the -rc family
          # (which also covers betas): fall back to it and hand the winning tag
          # to the build step below, self-healing to the stable tag at GA
          tag="${PHP_MINOR}"
          manifest=""
          if manifest="$(resolve "php:${PHP_MINOR}-cli")"; then
            :
          elif manifest="$(resolve "php:${PHP_MINOR}-rc-cli")"; then
            tag="${PHP_MINOR}-rc"
            echo "php:${PHP_MINOR}-cli is not published yet - building from php:${tag}-cli"
          fi
          if [ -n "$manifest" ] && digest="$(printf '%s' "$manifest" | sha256sum | cut -d' ' -f1)" && [ "${#digest}" -eq 64 ]; then
            echo "php:${tag}-cli is sha256:${digest}"
          else
            # A registry hiccup must not fail this job over a cache key. A
            # run-unique value guarantees a miss, so the restore-keys still give a
            # warm start, the build is still correct, and the entry written under
            # it is simply never matched again.
            digest="unresolved-${{ github.run_id }}"
            echo "::warning::Could not resolve the php:${PHP_MINOR}-cli digest - building without an exact cache key"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          # Thread safety and minor come first so the loosest restore-key below
          # still matches entries written before OS/arch joined the key.
          prefix="docker-debug-${{ matrix.ts }}-${PHP_MINOR}-${{ runner.os }}-${{ runner.arch }}-"
          {
            echo "prefix=${prefix}"
            echo "recipe=${prefix}${{ hashFiles('tools/docker/php-debug.Dockerfile') }}-"
            echo "key=${prefix}${{ hashFiles('tools/docker/php-debug.Dockerfile') }}-${digest}"
          } >> "$GITHUB_OUTPUT"

      # restore/save rather than the combined action: on an exact hit every layer
      # in the directory is still valid, so there is nothing to write back and the
      # `--cache-to` export below can be skipped outright. That export is not free
      # - the header-drift job measures it at 13-15s per target - and today it is
      # paid on every run only to be thrown away. The prefix keys still give a warm
      # start when the base image moved, which is what keeps that rebuild
      # incremental instead of a compile from zero.
      - name: Restore the debug image layer cache
        id: layer-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ steps.image-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.image-cache-key.outputs.recipe }}
            ${{ steps.image-cache-key.outputs.prefix }}
            docker-debug-${{ matrix.ts }}-${{ env.PHP_MINOR }}-

      - name: Build the debug PHP image
        run: |
          mkdir -p /tmp/.buildx-cache
          # Export the layers only when this run may actually store them.
          cache_to=""
          if [ "${{ steps.layer-cache.outputs.cache-hit }}" != "true" ]; then
            cache_to="--cache-to=type=local,dest=/tmp/.buildx-cache-new,mode=max"
          fi
          docker buildx build \
            -f tools/docker/php-debug.Dockerfile \
            --build-arg "PHP_VERSION=${{ steps.image-cache-key.outputs.tag }}" \
            --build-arg "PHP_TS=${{ matrix.ts }}" \
            --cache-from "type=local,src=/tmp/.buildx-cache" \
            $cache_to \
            --load \
            -t z-engine-php:debug .

      # Rotate instead of appending: a reused local cache dir accumulates stale
      # layers without bound, so each run saves only the layers it actually used
      - name: Rotate the layer cache
        if: steps.layer-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Saved before the tests run, not in a post step: these layers are the
      # expensive part and they are already correct here, so a failing test
      # should not cost the next run the compile as well.
      - name: Save the debug image layer cache
        if: steps.layer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ steps.image-cache-key.outputs.key }}

      - name: Run internal group with process isolation
        run: |
          docker run --rm -v "$PWD:/app" -w /app z-engine-php:debug \
            vendor/bin/phpunit --group internal --process-isolation

      # The shared-memory mutations of issue #41 corrupt engine memory when they
      # are wrong; on a debug build that surfaces as a Zend assertion failure
      # (zend_function_dtor) and a SIGABRT during request shutdown instead of a
      # silently wrong result. Skips fail the step (issue #124).
      - name: Run opcache/SHM group on the debug build
        run: |
          docker run --rm -v "$PWD:/app" -w /app z-engine-php:debug \
            vendor/bin/phpunit ${{ matrix.opcache_args }}

  header-drift:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Caches the generator image's toolchain layers (apt/clang/ext-ffi); the
      # emit stage itself always re-runs - it is the step that produces the
      # artifacts being drift-checked. generate.php rotates per-target subdirs.
      #
      # Both base images go into the key: this job builds one image per target
      # and nts starts from `php:<minor>-cli` while zts starts from
      # `php:<minor>-zts`, so either tag moving invalidates the toolchain layer.
      # Without them the entry freezes at whatever the first run produced and can
      # never be rewritten - which is the state this job was already in, paying
      # ~16s to reinstall clang and ~15s to export a cache nobody would store, on
      # every single run. See the same reasoning in tests-internal-debug.
      - name: Resolve the base image digests
        id: gen-cache-key
        run: |
          # Same helper as tests-internal-debug: prints the raw manifest only on
          # success, so a failed attempt cannot feed half a response into the hash.
          resolve() {
            local raw
            for attempt in 1 2 3; do
              if raw="$(docker buildx imagetools inspect "$1" --raw)" && [ -n "$raw" ]; then
                printf '%s' "$raw"
                return 0
              fi
              sleep "$((attempt * 3))"
            done
            return 1
          }
          # While the minor is pre-release Docker publishes only the -rc family
          # (which also covers betas); generate.php falls back the same way, so
          # the key hashes whichever manifests the build will actually use
          resolve_variant() {
            resolve "php:${PHP_MINOR}-$1" || resolve "php:${PHP_MINOR}-rc-$1"
          }
          if cli="$(resolve_variant cli)" && zts="$(resolve_variant zts)"; then
            digest="$(printf '%s%s' "$cli" "$zts" | sha256sum | cut -d' ' -f1)"
            echo "php:${PHP_MINOR}[-rc]-cli + php:${PHP_MINOR}[-rc]-zts hash to ${digest}"
          else
            # As above: a registry hiccup costs an exact key, never the job.
            digest="unresolved-${{ github.run_id }}"
            echo "::warning::Could not resolve the php:${PHP_MINOR} base image digests - building without an exact cache key"
          fi
          prefix="docker-gen-${PHP_MINOR}-${{ runner.os }}-${{ runner.arch }}-"
          {
            echo "prefix=${prefix}"
            echo "recipe=${prefix}${{ hashFiles('tools/generator/Dockerfile') }}-"
            echo "key=${prefix}${{ hashFiles('tools/generator/Dockerfile') }}-${digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the generator image layer cache
        id: gen-layer-cache
        uses: actions/cache/restore@v6
        with:
          path: /tmp/.buildx-gen-cache
          key: ${{ steps.gen-cache-key.outputs.key }}
          restore-keys: |
            ${{ steps.gen-cache-key.outputs.recipe }}
            ${{ steps.gen-cache-key.outputs.prefix }}
            docker-gen-${{ env.PHP_MINOR }}-

      # On an exact hit the restored layers are still valid, so generate.php is
      # told to read the cache without exporting it again - the export is the
      # expensive half and there would be nowhere to put the result.
      - name: Regenerate engine definitions
        run: composer gen-headers
        env:
          Z_ENGINE_BUILDX_CACHE_DIR: /tmp/.buildx-gen-cache
          Z_ENGINE_BUILDX_CACHE_READONLY: ${{ steps.gen-layer-cache.outputs.cache-hit == 'true' && '1' || '' }}

      - name: Save the generator image layer cache
        if: steps.gen-layer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/.buildx-gen-cache
          key: ${{ steps.gen-cache-key.outputs.key }}
      - name: Fail if the committed artifacts are stale
        run: |
          if ! git diff --exit-code -- include/ stubs/ .phpstorm.meta.php; then
            echo "::error::Generated engine definitions (or the struct stubs / phpstorm meta) are out of date. Run 'composer gen-headers' and commit the result."
            exit 1
          fi

  # The darwin counterpart of header-drift: regenerates natively on a macOS
  # runner (docker cannot produce darwin artifacts) and diffs only the dir the
  # runner's own architecture can regenerate. The linux job above stays safe
  # unscoped - linux regeneration never touches the darwin directories.
  header-drift-darwin:
    name: Generated darwin headers up to date (${{ matrix.runner-arch.arch }}, ${{ matrix.ts }})
    runs-on: ${{ matrix.runner-arch.runner }}
    # See tests-macos: skip brew's auto-update/cleanup so setup-php only pays for
    # the PHP install it actually needs.
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    strategy:
      fail-fast: false
      matrix:
        runner-arch:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
        ts: [nts, zts]
    steps:
      - uses: actions/checkout@v7

      - name: Check the generated definitions are committed
        id: artifacts
        run: |
          if [ -f "include/${PHP_MINOR}/darwin-${{ matrix.runner-arch.arch }}-${{ matrix.ts }}/engine.h" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::include/${PHP_MINOR}/darwin-${{ matrix.runner-arch.arch }}-${{ matrix.ts }} is not committed yet - run the 'Generate darwin headers' workflow (issue #58)"
          fi

      - name: Set up PHP
        if: steps.artifacts.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
        with:
          php-version: ${{ env.PHP_MINOR }}
          extensions: ffi
          ini-values: ffi.enable=1
          coverage: none

      - name: Regenerate engine definitions natively
        if: steps.artifacts.outputs.present == 'true'
        run: php tools/generator/generate.php --native --php=${{ env.PHP_MINOR }} --ts=${{ matrix.ts }}

      - name: Fail if the committed artifacts are stale
        if: steps.artifacts.outputs.present == 'true'
        run: |
          if ! git diff --exit-code -- "include/${PHP_MINOR}/darwin-${{ matrix.runner-arch.arch }}-${{ matrix.ts }}"; then
            echo "::error::Generated darwin engine definitions are out of date. Run the 'Generate darwin headers' workflow and merge its commit."
            exit 1
          fi

  # The windows counterpart of header-drift: regenerates natively on a
  # Windows runner (docker cannot produce windows artifacts) and diffs only
  # the directory this runner can regenerate.
  header-drift-windows:
    name: Generated windows headers up to date (${{ matrix.ts }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ts: [nts, zts]
    defaults:
      run:
        shell: bash
    steps:
      # The committed artifacts are LF; keep the checkout byte-exact so the
      # regeneration diff below compares content, not line endings.
      - name: Keep line endings byte-exact
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v7

      - name: Check the generated definitions are committed
        id: artifacts
        run: |
          if [ -f "include/${PHP_MINOR}/windows-x64-${{ matrix.ts }}/engine.h" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::include/${PHP_MINOR}/windows-x64-${{ matrix.ts }} is not committed yet - run the 'Generate windows headers' workflow (issue #59)"
          fi

      - name: Set up PHP
        if: steps.artifacts.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
        with:
          php-version: ${{ env.PHP_MINOR }}
          # zip: generate.php extracts the PHP devel pack with ZipArchive
          extensions: ffi, zip
          ini-values: ffi.enable=1
          coverage: none

      # clang locates the MSVC CRT and Windows SDK headers through the INCLUDE
      # environment variable this step exports.
      - name: Set up the MSVC toolchain environment
        if: steps.artifacts.outputs.present == 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Regenerate engine definitions natively
        if: steps.artifacts.outputs.present == 'true'
        run: php tools/generator/generate.php --native --php=${{ env.PHP_MINOR }} --ts=${{ matrix.ts }}

      - name: Fail if the committed artifacts are stale
        if: steps.artifacts.outputs.present == 'true'
        run: |
          if ! git diff --exit-code -- "include/${PHP_MINOR}/windows-x64-${{ matrix.ts }}"; then
            echo "::error::Generated windows engine definitions are out of date. Run the 'Generate windows headers' workflow and merge its commit."
            exit 1
          fi
